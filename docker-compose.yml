# Local Postgres for the API. The password is a development default, not a production secret.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sosh
      POSTGRES_PASSWORD: sosh
      POSTGRES_DB: sosh
    ports:
      - "5432:5432"
    volumes:
      - sosh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sosh -d sosh"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  sosh_pg:
